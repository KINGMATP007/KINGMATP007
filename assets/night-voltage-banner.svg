  <circle cx="1050" cy="72" r="4" fill="#E9FF00" filter="url(#softGlow)"/>
  <path d="M785 0L1200 0V320H1005Z" fill="url(#glow)" opacity=".65"/>
  <path d="M34 34H90M34 34V90M1166 286H1110M1166 286V230" stroke="url(#edge)" stroke-width="3" fill="none"/>
