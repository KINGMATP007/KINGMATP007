  <rect x="1" y="1" width="1198" height="318" rx="17" fill="url(#grid)" stroke="#FF1744" stroke-opacity=".72" stroke-width="2"/>
  <path d="M0 255H180L218 217H315M1200 72H1050L1018 104H940" fill="none" stroke="#FF1744" stroke-width="2" stroke-opacity=".8"/>
