<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">KINGMATP007 — Night Voltage</title>
  <desc id="desc">A black futuristic banner with neon red circuitry and electric yellow typography.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF1744"/>
      <stop offset="0.52" stop-color="#E9FF00"/>
      <stop offset="1" stop-color="#FF1744"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF1744" stop-opacity=".24"/>
      <stop offset="1" stop-color="#E9FF00" stop-opacity=".04"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#FF1744" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-50%" width="160%" height="200%">
