  <text x="50" y="294" fill="#E9FF00" font-family="Consolas, monospace" font-size="10" letter-spacing="2">SYS.ONLINE</text>
  <text x="1150" y="294" text-anchor="end" fill="#FF1744" font-family="Consolas, monospace" font-size="10" letter-spacing="2">NV-007</text>
